<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Adit ◈ Ticket Command Center</title>

  <!-- XLSX Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- STYLE -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0b0f;
      color: #e2e8f0;
    }

    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #161a22;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #111318;
      border: 1px solid #2a3347;
      color: white;
      border-radius: 5px;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      border: none;
      background: #00b4ff;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
    }

    #main-app {
      display: none;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    td, th {
      padding: 10px;
      border-bottom: 1px solid #1e2433;
    }

    .upload-zone {
      border: 2px dashed #2a3347;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen" class="center">
  <div class="login-box">
    <h2>Login</h2>
    <input id="login-email" placeholder="you@adit.com" />
    <input id="login-pass" type="password" placeholder="password" />
    <button onclick="login()">Login</button>
    <p id="login-error" style="color:red;"></p>
  </div>
</div>

<!-- MAIN -->
<div id="main-app">
  <h2>Ticket Command Center</h2>

  <div class="upload-zone" onclick="document.getElementById('file-input').click()">
    Click to upload Excel
  </div>

  <input type="file" id="file-input" style="display:none" />

  <button onclick="loadSample()">Load Sample Data</button>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Agent</th>
        <th>Subject</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<!-- SCRIPT -->
<script>
const $ = id => document.getElementById(id);
let tickets = [];

/* LOGIN */
function login() {
  const email = $('login-email').value;
  const pass = $('login-pass').value;

  if (!email.endsWith('@adit.com')) {
    $('login-error').textContent = 'Use @adit.com email';
    return;
  }

  if (!pass) {
    $('login-error').textContent = 'Enter password';
    return;
  }

  $('login-screen').style.display = 'none';
  $('main-app').style.display = 'block';
}

/* FILE UPLOAD */
$('file-input').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = e => {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    tickets = json.map((row, i) => ({
      id: row['Ticket ID'] || i,
      agent: row['Agent'] || 'Unknown',
      subject: row['Subject'] || '',
      status: row['Status'] || 'Open'
    }));

    renderTable();
  };

  reader.readAsArrayBuffer(file);
};

/* RENDER */
function renderTable() {
  const tbody = $('table-body');

  if (!tickets.length) {
    tbody.innerHTML = '<tr><td colspan="4">No data</td></tr>';
    return;
  }

  tbody.innerHTML = tickets.map(t => `
    <tr>
      <td>${t.id}</td>
      <td>${t.agent}</td>
      <td>${t.subject}</td>
      <td>${t.status}</td>
    </tr>
  `).join('');
}

/* SAMPLE DATA */
function loadSample() {
  tickets = [
    { id: '101', agent: 'Imran', subject: 'Call issue', status: 'Open' },
    { id: '102', agent: 'Sarah', subject: 'Login error', status: 'Pending' }
  ];
  renderTable();
}
</script>

</body>
</html>
